
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>Head in the Clouds</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="popup">
    <h1>Head in the Clouds</h1>

    <p>
        Estimate whether you are facing your usual
        screen-viewing position. Runs locally on your device.
    </p>

    <div class="buttons">
        <button id="open-tracker">
            Open Eye Tracker
        </button>

        <button id="open-dashboard">
            View Dashboard
        </button>
    </div>

    <p class="muted">
        The webcam runs only while the tracker tab is open
        and you enable it.
    </p>

    <script src="popup.js"></script>
</body>
</html>
